<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            font-family: 'Rajdhani', sans-serif;
            background: #0a0014;
            position: relative;
        }

        .grid-bg {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(236, 72, 153, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(236, 72, 153, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
            transform: perspective(500px) rotateX(60deg);
            transform-origin: center top;
            animation: grid-scroll 10s linear infinite;
        }

        @keyframes grid-scroll {
            0% { background-position: 0 0; }
            100% { background-position: 0 50px; }
        }

        .signals-container {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
            transform: perspective(500px) rotateX(60deg);
            transform-origin: center top;
        }

        .signal {
            position: absolute;
            width: 4px;
            height: 30px;
            background: linear-gradient(to top, transparent, #ec4899, transparent);
            box-shadow: 0 0 10px #ec4899;
            animation: signal-rise linear infinite;
            opacity: 0;
            will-change: transform, opacity;
        }

        .signal::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: inherit;
            filter: blur(3px);
        }

        @keyframes signal-rise {
            0% {
                transform: translateY(100vh) scaleY(0.5);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) scaleY(1.5);
                opacity: 0;
            }
        }

        .signal:nth-child(odd) {
            background: linear-gradient(to top, transparent, #8b5cf6, transparent);
            box-shadow: 0 0 10px #8b5cf6, 0 0 20px #8b5cf6;
        }

        .signal-pulse {
            position: absolute;
            width: 2px;
            height: 8px;
            background: #f472b6;
            box-shadow: 0 0 8px #f472b6;
            animation: pulse-rise linear infinite;
        }

        @keyframes pulse-rise {
            0% {
                transform: translateY(100vh);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateY(-50px);
                opacity: 0;
            }
        }

        .scanline {
            position: fixed;
            inset: 0;
            background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            z-index: 1;
            pointer-events: none;
        }

        .neon-glow-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        .neon-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.5;
            animation: orb-float 20s ease-in-out infinite;
        }

        .neon-orb:nth-child(1) {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #ec4899, transparent);
            top: -10%;
            left: -10%;
        }

        .neon-orb:nth-child(2) {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #8b5cf6, transparent);
            bottom: -20%;
            right: -15%;
            animation-delay: -7s;
        }

        .neon-orb:nth-child(3) {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #f472b6, transparent);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -14s;
        }

        @keyframes orb-float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(50px, -30px) scale(1.1); }
            50% { transform: translate(-30px, 50px) scale(0.9); }
            75% { transform: translate(30px, 30px) scale(1.05); }
        }

        .particles {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #f472b6;
            border-radius: 50%;
            box-shadow: 0 0 10px #ec4899;
            animation: particle-rise linear infinite;
            will-change: transform, opacity;
        }

        @keyframes particle-rise {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1);
                opacity: 0;
            }
        }

        .content {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-container {
            position: relative;
            width: 100%;
            max-width: 420px;
        }

        .register-form {
            background: linear-gradient(145deg, rgba(30, 10, 50, 0.95), rgba(15, 0, 30, 0.98));
            padding: 50px 35px 40px;
            width: 100%;
            position: relative;
            clip-path: polygon(
                0 20px, 20px 0, calc(100% - 20px) 0, 100% 20px,
                100% calc(100% - 20px), calc(100% - 20px) 100%, 20px 100%, 0 calc(100% - 20px)
            );
            border: 2px solid transparent;
            background-clip: padding-box;
            box-shadow: 
                0 0 30px rgba(236, 72, 153, 0.3),
                0 0 60px rgba(139, 92, 246, 0.2),
                0 20px 50px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                inset 0 -1px 0 rgba(0, 0, 0, 0.3);
            transform-style: preserve-3d;
            backface-visibility: hidden;
        }

        .register-form::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(135deg, #ec4899, #8b5cf6, #ec4899);
            background-size: 200% 200%;
            animation: border-flow 3s linear infinite;
            clip-path: polygon(
                0 20px, 20px 0, calc(100% - 20px) 0, 100% 20px,
                100% calc(100% - 20px), calc(100% - 20px) 100%, 20px 100%, 0 calc(100% - 20px)
            );
            z-index: -1;
        }

        .register-form::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg, rgba(30, 10, 50, 0.9), rgba(15, 0, 30, 0.95));
            clip-path: polygon(
                0 20px, 20px 0, calc(100% - 20px) 0, 100% 20px,
                100% calc(100% - 20px), calc(100% - 20px) 100%, 20px 100%, 0 calc(100% - 20px)
            );
            z-index: -1;
        }

        .register-inner-3d {
            position: relative;
            transform: translateZ(20px);
            padding: 5px;
        }

        .card-3d-glow {
            position: absolute;
            inset: -20px;
            background: radial-gradient(ellipse at center, rgba(236, 72, 153, 0.15) 0%, transparent 70%);
            pointer-events: none;
            z-index: -2;
            animation: card-glow-pulse 3s ease-in-out infinite;
        }

        @keyframes card-glow-pulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }

        @keyframes border-flow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .corner {
            position: absolute;
            width: 30px;
            height: 30px;
            z-index: 5;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: #ec4899;
            box-shadow: 0 0 10px #ec4899, 0 0 20px #ec4899;
        }

        .corner-tl {
            top: 5px;
            left: 5px;
        }
        .corner-tl::before {
            width: 20px;
            height: 3px;
            top: 0;
            left: 0;
        }
        .corner-tl::after {
            width: 3px;
            height: 20px;
            top: 0;
            left: 0;
        }

        .corner-tr {
            top: 5px;
            right: 5px;
        }
        .corner-tr::before {
            width: 20px;
            height: 3px;
            top: 0;
            right: 0;
        }
        .corner-tr::after {
            width: 3px;
            height: 20px;
            top: 0;
            right: 0;
        }

        .corner-bl {
            bottom: 5px;
            left: 5px;
        }
        .corner-bl::before {
            width: 20px;
            height: 3px;
            bottom: 0;
            left: 0;
        }
        .corner-bl::after {
            width: 3px;
            height: 20px;
            bottom: 0;
            left: 0;
        }

        .corner-br {
            bottom: 5px;
            right: 5px;
        }
        .corner-br::before {
            width: 20px;
            height: 3px;
            bottom: 0;
            right: 0;
        }
        .corner-br::after {
            width: 3px;
            height: 20px;
            bottom: 0;
            right: 0;
        }

        .form-title {
            font-family: 'Righteous', 'Fredoka', cursive;
            font-size: 2.2rem;
            font-weight: 700;
            color: transparent;
            margin-bottom: 30px;
            position: relative;
            z-index: 2;
            text-align: center;
            background: linear-gradient(135deg, #ec4899, #8b5cf6, #fbbf24, #ec4899);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            animation: gradient-text 4s ease infinite, text-3d-float 3s ease-in-out infinite;
            text-shadow: 
                0 1px 0 #ccc,
                0 2px 0 #c9c9c9,
                0 3px 0 #bbb,
                0 4px 0 #b9b9b9,
                0 5px 0 #aaa,
                0 6px 1px rgba(0,0,0,.1),
                0 0 5px rgba(0,0,0,.1),
                0 1px 3px rgba(0,0,0,.3),
                0 3px 5px rgba(0,0,0,.2),
                0 5px 10px rgba(0,0,0,.25),
                0 10px 10px rgba(0,0,0,.2),
                0 20px 20px rgba(0,0,0,.15);
            transform-style: preserve-3d;
            perspective: 500px;
        }

        @keyframes gradient-text {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes text-3d-float {
            0%, 100% {
                transform: translateY(0) rotateX(5deg) rotateY(-5deg);
            }
            25% {
                transform: translateY(-5px) rotateX(-5deg) rotateY(5deg);
            }
            50% {
                transform: translateY(-8px) rotateX(3deg) rotateY(3deg);
            }
            75% {
                transform: translateY(-3px) rotateX(-3deg) rotateY(-3deg);
            }
        }

        .form-title::before {
            content: 'Регистрация';
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: blur(15px);
            opacity: 0.5;
            z-index: -1;
            animation: glow-pulse 2s ease-in-out infinite;
        }

        @keyframes glow-pulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.02); }
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            color: #f472b6;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(236, 72, 153, 0.5);
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 70%;
            background: linear-gradient(180deg, #ec4899, #8b5cf6);
            box-shadow: 0 0 10px #ec4899;
        }

        .form-group input {
            width: 100%;
            padding: 15px 15px 15px 20px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            font-weight: 500;
            color: #fff;
            background: rgba(236, 72, 153, 0.05);
            border: 1px solid rgba(236, 72, 153, 0.3);
            outline: none;
            transition: all 0.3s ease;
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
        }

        .form-group input::placeholder {
            color: rgba(244, 114, 182, 0.5);
        }

        .form-group input:focus {
            background: rgba(236, 72, 153, 0.1);
            border-color: #ec4899;
            box-shadow: 
                0 0 15px rgba(236, 72, 153, 0.4),
                inset 0 0 15px rgba(236, 72, 153, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            border: none;
            cursor: pointer;
            position: relative;
            margin-top: 10px;
            clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 10px 100%, 0 50%);
            box-shadow: 
                0 0 20px rgba(236, 72, 153, 0.5),
                0 0 40px rgba(139, 92, 246, 0.3);
            transition: all 0.3s ease;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
            clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 10px 100%, 0 50%);
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 0 30px rgba(236, 72, 153, 0.7),
                0 0 60px rgba(139, 92, 246, 0.5),
                0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
            box-shadow: 
                0 0 15px rgba(236, 72, 153, 0.4),
                0 0 30px rgba(139, 92, 246, 0.2);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .form-message {
            margin-top: 20px;
            font-size: 0.9rem;
            text-align: center;
            min-height: 25px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 500;
        }

        .form-message.success {
            color: #34d399;
            text-shadow: 0 0 10px rgba(52, 211, 153, 0.5);
        }

        .form-message.error {
            color: #f87171;
            text-shadow: 0 0 10px rgba(248, 113, 113, 0.5);
        }

        .deco-line {
            position: absolute;
            background: linear-gradient(90deg, transparent, #ec4899, transparent);
            height: 1px;
            width: 100%;
            left: 0;
        }

        .deco-line-top {
            top: 60px;
        }

        .deco-line-bottom {
            bottom: 60px;
        }

        .scan-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ec4899, transparent);
            opacity: 0.5;
            animation: scan 3s linear infinite;
        }

        @keyframes scan {
            0% { top: 0; opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { top: 100%; opacity: 0; }
        }

        .hex-decoration {
            position: absolute;
            width: 40px;
            height: 40px;
            opacity: 0.3;
        }

        .hex-decoration svg {
            width: 100%;
            height: 100%;
        }

        .hex-1 {
            top: -20px;
            left: -20px;
        }

        .hex-2 {
            top: -20px;
            right: -20px;
        }

        .hex-3 {
            bottom: -20px;
            left: -20px;
        }

        .hex-4 {
            bottom: -20px;
            right: -20px;
        }

        .floating-elements {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        .float-shape {
            position: absolute;
            border: 1px solid rgba(236, 72, 153, 0.3);
            animation: float-rotate 20s linear infinite;
        }

        .float-shape:nth-child(1) {
            width: 100px;
            height: 100px;
            top: 10%;
            left: 5%;
            transform: rotate(45deg);
        }

        .float-shape:nth-child(2) {
            width: 60px;
            height: 60px;
            top: 70%;
            right: 10%;
            border-color: rgba(139, 92, 246, 0.3);
            animation-delay: -5s;
        }

        .float-shape:nth-child(3) {
            width: 80px;
            height: 80px;
            bottom: 20%;
            left: 15%;
            border-radius: 50%;
            border-color: rgba(244, 114, 182, 0.3);
            animation-delay: -10s;
        }

        @keyframes float-rotate {
            0% { transform: rotate(0deg) translateY(0); }
            50% { transform: rotate(180deg) translateY(-20px); }
            100% { transform: rotate(360deg) translateY(0); }
        }

        .status-bar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.6rem;
            color: #ec4899;
            text-transform: uppercase;
            letter-spacing: 3px;
            padding: 8px 20px;
            border: 1px solid rgba(236, 72, 153, 0.3);
            background: rgba(10, 0, 20, 0.8);
            z-index: 100;
            text-shadow: 0 0 10px #ec4899;
            animation: status-pulse 2s ease-in-out infinite;
        }

        @keyframes status-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .glitch {
            position: relative;
        }

        .glitch::after {
            content: attr(data-text);
            position: absolute;
            left: 2px;
            top: 0;
            color: #8b5cf6;
            overflow: hidden;
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
            animation: glitch-anim 3s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        .rocket-engine {
            position: absolute;
            width: 40px;
            height: 60px;
            filter: drop-shadow(0 0 15px rgba(236, 72, 153, 0.6));
            transform-style: preserve-3d;
        }

        .rockets-perspective-wrapper {
            position: absolute;
            inset: -40px;
            z-index: 20;
            pointer-events: none;
            transform-style: preserve-3d;
        }

        .rocket-engine svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 8px rgba(236, 72, 153, 0.4));
        }

        .engine-fire {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 22px;
            height: 70px;
            background: linear-gradient(to bottom, #fff 0%, #f9a8d4 15%, #ec4899 40%, #8b5cf6 70%, transparent 100%);
            border-radius: 50% 50% 20% 20%;
            filter: blur(4px);
            animation: fire-flicker 0.08s ease-in-out infinite alternate;
            opacity: 0.95;
        }

        .engine-fire::before {
            content: '';
            position: absolute;
            inset: 3px;
            background: linear-gradient(to bottom, #fff 0%, #f9a8d4 25%, transparent 60%);
            border-radius: inherit;
            filter: blur(2px);
        }

        .engine-fire::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 50px;
            background: linear-gradient(to bottom, #ec4899, #8b5cf6, transparent);
            border-radius: 50%;
            filter: blur(6px);
            animation: fire-trail 0.15s ease-in-out infinite alternate;
        }

        .engine-sparkle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #f9a8d4;
            border-radius: 50%;
            box-shadow: 0 0 8px #ec4899, 0 0 15px #8b5cf6;
            animation: sparkle-rise 0.6s ease-out infinite;
        }

        .engine-sparkle:nth-child(3) { left: 15%; animation-delay: 0s; bottom: 5px; }
        .engine-sparkle:nth-child(4) { left: 35%; animation-delay: 0.15s; bottom: 5px; }
        .engine-sparkle:nth-child(5) { left: 55%; animation-delay: 0.3s; bottom: 5px; }
        .engine-sparkle:nth-child(6) { left: 75%; animation-delay: 0.45s; bottom: 5px; }

        @keyframes fire-flicker {
            0% { transform: translateX(-50%) scaleY(1) scaleX(1); opacity: 0.95; }
            100% { transform: translateX(-50%) scaleY(1.4) scaleX(0.6); opacity: 0.8; }
        }

        @keyframes fire-trail {
            0% { opacity: 0.8; transform: translateX(-50%) scaleY(1) scaleX(1); }
            100% { opacity: 0.3; transform: translateX(-50%) scaleY(1.5) scaleX(0.5); }
        }

        .sparkle-rise {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-60px) scale(0); opacity: 0; }
        }

        .engine-tl { top: -30px; left: -20px; }
        .engine-tr { top: -30px; right: -20px; }
        .engine-bl { bottom: -30px; left: -20px; }
        .engine-br { bottom: -30px; right: -20px; }

        .register-container {
            position: relative;
            width: 100%;
            max-width: 420px;
        }

        .register-form {
            background: linear-gradient(145deg, rgba(30, 10, 50, 0.95), rgba(15, 0, 30, 0.98));
            padding: 50px 35px 40px;
            width: 100%;
            position: relative;
            clip-path: polygon(
                0 20px, 20px 0, calc(100% - 20px) 0, 100% 20px,
                100% calc(100% - 20px), calc(100% - 20px) 100%, 20px 100%, 0 calc(100% - 20px)
            );
            border: 2px solid transparent;
            background-clip: padding-box;
            box-shadow: 
                0 0 30px rgba(236, 72, 153, 0.3),
                0 0 60px rgba(139, 92, 246, 0.2),
                0 25px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                inset 0 -1px 0 rgba(0, 0, 0, 0.3);
            transform-style: preserve-3d;
        }

        .register-container {
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        .register-form {
            transition: transform 0.1s ease-out;
        }

        .glitch-border {
            position: absolute;
            inset: -3px;
            pointer-events: none;
            z-index: 1;
        }

        .glitch-border::before,
        .glitch-border::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #ec4899, #8b5cf6, #ec4899);
            background-size: 200% 200%;
            animation: border-flow 3s linear infinite;
            clip-path: polygon(
                0 20px, 20px 0, calc(100% - 20px) 0, 100% 20px,
                100% calc(100% - 20px), calc(100% - 20px) 100%, 20px 100%, 0 calc(100% - 20px)
            );
            opacity: 0;
        }

        .glitch-border::before {
            animation: border-flow 3s linear infinite, glitch-clip-1 4s steps(1) infinite;
            filter: blur(1px);
        }

        .glitch-border::after {
            animation: border-flow 3s linear infinite, glitch-clip-2 4s steps(1) infinite;
            filter: blur(1px);
        }

        @keyframes glitch-clip-1 {
            0%, 90%, 100% { opacity: 0; }
            92% { opacity: 0.8; clip-path: polygon(0 0, 100% 0, 100% 30%, 0 30%); }
            94% { opacity: 0; }
            96% { opacity: 0.6; clip-path: polygon(0 70%, 100% 70%, 100% 100%, 0 100%); }
        }

        @keyframes glitch-clip-2 {
            0%, 85%, 100% { opacity: 0; }
            87% { opacity: 0.7; clip-path: polygon(40% 0, 60% 0, 60% 100%, 40% 100%); }
            89% { opacity: 0; }
            91% { opacity: 0.5; clip-path: polygon(0 40%, 100% 40%, 100% 60%, 0 60%); }
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="signals-container" id="signals"></div>
    <div class="scanline"></div>
    
    <div class="neon-glow-bg">
        <div class="neon-orb"></div>
        <div class="neon-orb"></div>
        <div class="neon-orb"></div>
    </div>

    <div class="particles" id="particles"></div>

    <div class="floating-elements">
        <div class="float-shape"></div>
        <div class="float-shape"></div>
        <div class="float-shape"></div>
    </div>

    <div class="status-bar">System Online</div>

    <div class="content">
        <div class="register-container">
            <div class="rockets-perspective-wrapper" id="rockets-wrapper"></div>
            <div class="hex-decoration hex-1">
                <svg viewBox="0 0 100 100">
                    <polygon points="50,5 95,27.5 95,72.5 50,95 5,72.5 5,27.5" fill="none" stroke="#ec4899" stroke-width="2"/>
                </svg>
            </div>
            <div class="hex-decoration hex-2">
                <svg viewBox="0 0 100 100">
                    <polygon points="50,5 95,27.5 95,72.5 50,95 5,72.5 5,27.5" fill="none" stroke="#8b5cf6" stroke-width="2"/>
                </svg>
            </div>
            <div class="hex-decoration hex-3">
                <svg viewBox="0 0 100 100">
                    <polygon points="50,5 95,27.5 95,72.5 50,95 5,72.5 5,27.5" fill="none" stroke="#f472b6" stroke-width="2"/>
                </svg>
            </div>
            <div class="hex-decoration hex-4">
                <svg viewBox="0 0 100 100">
                    <polygon points="50,5 95,27.5 95,72.5 50,95 5,72.5 5,27.5" fill="none" stroke="#ec4899" stroke-width="2"/>
                </svg>
            </div>

            <form class="register-form" id="registerForm" onsubmit="handleRegister(event)">
                <div class="card-3d-glow"></div>
                <div class="glitch-border"></div>
                <div class="scan-line"></div>
                <div class="corner corner-tl"></div>
                <div class="corner corner-tr"></div>
                <div class="corner corner-bl"></div>
                <div class="corner corner-br"></div>
                
                <div class="register-inner-3d">
                    <h2 class="form-title">Регистрация</h2>
                    
                    <div class="form-group">
                        <label>Имя пользователя</label>
                        <div class="input-wrapper">
                            <input type="text" name="name" placeholder="Введите имя" required autocomplete="name">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Пароль</label>
                        <div class="input-wrapper">
                            <input type="password" name="password" placeholder="Введите пароль" required minlength="6" autocomplete="new-password">
                        </div>
                    </div>
                    
                    <button type="submit" class="submit-btn" id="submitBtn">
                        <span class="btn-text">Войти</span>
                        <span class="btn-loader" style="display:none;">⏳</span>
                    </button>
                    
                    <p class="form-message" id="formMessage"></p>
                </div>
            </form>
        </div>
    </div>

    <script>
        function handleRegister(event) {
            event.preventDefault();
            const form = event.target;
            const submitBtn = document.getElementById('submitBtn');
            const btnText = submitBtn.querySelector('.btn-text');
            const btnLoader = submitBtn.querySelector('.btn-loader');
            const message = document.getElementById('formMessage');

            const formData = {
                name: form.name.value.trim(),
                password: form.password.value
            };

            submitBtn.disabled = true;
            btnText.style.display = 'none';
            btnLoader.style.display = 'inline';
            message.textContent = '';
            message.className = 'form-message';

            fetch('https://api.example.com/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData)
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Ошибка регистрации');
                }
                return response.json();
            })
            .then(data => {
                message.textContent = 'Добро пожаловать!';
                message.className = 'form-message success';
                form.reset();
            })
            .catch(error => {
                message.textContent = error.message || 'Произошла ошибка. Попробуйте позже.';
                message.className = 'form-message error';
            })
            .finally(() => {
                submitBtn.disabled = false;
                btnText.style.display = 'inline';
                btnLoader.style.display = 'none';
            });
        }

        function createParticles() {
            const container = document.getElementById('particles');
            const count = window.innerWidth < 768 ? 15 : 25;
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                particle.style.animationDelay = Math.random() * 10 + 's';
                particle.style.width = (Math.random() * 3 + 2) + 'px';
                particle.style.height = particle.style.width;
                container.appendChild(particle);
            }
        }

        function createSignals() {
            const container = document.getElementById('signals');
            const count = window.innerWidth < 768 ? 20 : 35;
            
            for (let i = 0; i < count; i++) {
                const signal = document.createElement('div');
                signal.className = 'signal';
                signal.style.left = Math.random() * 100 + '%';
                signal.style.animationDuration = (Math.random() * 3 + 2) + 's';
                signal.style.animationDelay = Math.random() * 5 + 's';
                signal.style.height = (Math.random() * 40 + 20) + 'px';
                container.appendChild(signal);
            }

            for (let i = 0; i < count / 2; i++) {
                const pulse = document.createElement('div');
                pulse.className = 'signal-pulse';
                pulse.style.left = Math.random() * 100 + '%';
                pulse.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
                pulse.style.animationDelay = Math.random() * 3 + 's';
                container.appendChild(pulse);
            }
        }

        createParticles();
        createSignals();

        const container = document.querySelector('.register-container');
        const rocketsWrapper = document.getElementById('rockets-wrapper');
        
        const rocketPositions = [
            { top: -30, left: 20 },
            { top: -30, right: 20 },
            { bottom: -30, left: 20 },
            { bottom: -30, right: 20 }
        ];
        
        const rockets = [];
        rocketPositions.forEach((pos, i) => {
            const rocket = document.createElement('div');
            rocket.className = `rocket-engine engine-${['tl', 'tr', 'bl', 'br'][i]}`;
            rocket.innerHTML = `
                <svg viewBox="0 0 40 60">
                    <defs>
                        <linearGradient id="rocket-body-${i}" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#2a2a3a"/>
                            <stop offset="50%" style="stop-color:#4a4a5a"/>
                            <stop offset="100%" style="stop-color:#1a1a2a"/>
                        </linearGradient>
                    </defs>
                    <path d="M12 5 L28 5 L30 12 L30 20 L35 20 L35 35 L30 35 L30 45 L25 55 L15 55 L10 45 L10 35 L5 35 L5 20 L10 20 L10 12 Z" fill="url(#rocket-body-${i})" stroke="${i % 2 === 0 ? '#ec4899' : '#8b5cf6'}" stroke-width="1"/>
                    <ellipse cx="20" cy="12" rx="6" ry="4" fill="#1a1a2a" stroke="${i % 2 === 0 ? '#ec4899' : '#8b5cf6'}" stroke-width="0.8"/>
                    <rect x="14" y="35" width="12" height="15" fill="#222" stroke="${i % 2 === 0 ? '#8b5cf6' : '#ec4899'}" stroke-width="0.5" rx="2"/>
                    <line x1="20" y1="8" x2="20" y2="0" stroke="${i % 2 === 0 ? '#ec4899' : '#8b5cf6'}" stroke-width="1.5" opacity="0.7"/>
                </svg>
                <div class="engine-fire"></div>
                <div class="engine-sparkle"></div>
                <div class="engine-sparkle"></div>
                <div class="engine-sparkle"></div>
            `;
            rocket.style.position = 'absolute';
            rocket.style.top = pos.top + 'px';
            rocket.style.left = pos.left + 'px';
            if (pos.right !== undefined) { rocket.style.right = pos.right + 'px'; rocket.style.left = 'auto'; }
            if (pos.bottom !== undefined) { rocket.style.bottom = pos.bottom + 'px'; rocket.style.top = 'auto'; }
            rocketsWrapper.appendChild(rocket);
            rockets.push(rocket);
        });

        let mouseX = 0, mouseY = 0;
        let currentX = 0, currentY = 0;

        document.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            mouseX = ((e.clientX - centerX) / (rect.width / 2)).toFixed(2) * 1;
            mouseY = ((e.clientY - centerY) / (rect.height / 2)).toFixed(2) * 1;
        });

        function animate() {
            currentX += (mouseX - currentX) * 0.1;
            currentY += (mouseY - currentY) * 0.1;
            
            const rotateX = (-currentY * 5).toFixed(1);
            const rotateY = (currentX * 5).toFixed(1);
            
            container.style.transform = `perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            
            rockets.forEach((rocket, i) => {
                const tiltX = (currentY * 8 * (i < 2 ? 1 : -1)).toFixed(1);
                const tiltY = (currentX * 8 * (i % 2 === 0 ? -1 : 1)).toFixed(1);
                rocket.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg) translateZ(30px)`;
            });
            
            requestAnimationFrame(animate);
        }
        
        animate();

        document.addEventListener('mouseleave', () => {
            mouseX = 0;
            mouseY = 0;
        });
    </script>
</body>
</html>
